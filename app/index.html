<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Plex HDR</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Samsung product APIs (AVPlay, productinfo). Resolved by the TV runtime; 404s harmlessly in a desktop browser. -->
    <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
    <!-- AVPlay renders video on a hardware plane behind this object; the page must stay transparent while playing. -->
    <object id="av-player" type="application/avplayer"></object>
    <video id="html5-player" playsinline></video>

    <div id="backdrop" class="bd-plain"><div class="bd-layer"></div><div class="bd-layer"></div><div class="bd-shade"></div></div>
    <div id="app"></div>
    <div id="sheet" class="hidden"></div>

    <div id="player-ui" class="hidden">
        <div id="subtitle"></div>
        <div id="osd">
            <div id="osd-top"><span id="osd-ends"></span></div>
            <div id="osd-state"></div>
            <div id="osd-jump"></div>
            <div id="osd-bottom">
                <div id="osd-kicker"></div>
                <div id="osd-title"></div>
                <div id="osd-badges"></div>
                <div id="osd-scrub">
                    <div id="osd-thumb" class="hidden"><div class="img"></div><div class="t"></div></div>
                    <div id="osd-bar"><div id="osd-progress"></div><div id="osd-marks"></div><div id="osd-head"></div></div>
                </div>
                <div id="osd-times"><span id="osd-elapsed"></span><span id="osd-chapter"></span><span id="osd-remaining"></span></div>
                <div id="osd-hint"><span><b>▼</b> Info &amp; tracks</span><span><b>◀ ▶</b> −10 s / +30 s</span><span><b>CH</b> Chapters</span><span><i class="key-y"></i> Audio fix</span></div>
            </div>
            <div id="osd-spinner"></div>
        </div>
        <div id="skip" class="hidden">Skip Intro</div>
        <div id="upnext" class="hidden"></div>
        <div id="panel" class="hidden"></div>
    </div>

    <div id="toast" class="hidden"></div>

    <script>
        /* Desktop browser only: scale the fixed 1920x1080 page to fit the window. The TV never runs this. */
        (function () {
            if (window.tizen) return;
            var html = document.documentElement, body = document.body;
            html.style.cssText = 'width:100vw;height:100vh;overflow:hidden;background:#000';
            body.style.position = 'absolute';
            body.style.transformOrigin = '0 0';
            function fit() {
                var s = Math.min(innerWidth / 1920, innerHeight / 1080);
                body.style.left = (innerWidth - 1920 * s) / 2 + 'px';
                body.style.top = (innerHeight - 1080 * s) / 2 + 'px';
                body.style.transform = 'scale(' + s + ')';
            }
            addEventListener('resize', fit);
            fit();
        })();
    </script>
    <script src="js/vendor/qrcode.min.js"></script>
    <script src="js/util.js"></script>
    <script src="js/plex.js"></script>
    <!-- Optional API keys (TMDB, OMDb, OpenSubtitles). Copy keys.example.js to keys.js; it is not committed. -->
    <script src="js/keys.js"></script>
    <script src="js/online.js"></script>
    <script src="js/memory.js"></script>
    <script src="js/decide.js"></script>
    <script src="js/subs.js"></script>
    <script src="js/bif.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
